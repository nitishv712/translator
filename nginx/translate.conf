# Reverse proxy for the translator stack's only published port
# (docker-compose.yml: translate -> 6010:8200). Terminates TLS here and
# forwards to gunicorn, which already has its own worker timeout (60s, see
# translate-service/Dockerfile) — nginx's proxy_read_timeout below is just
# set comfortably above that so nginx doesn't cut the connection first.
#
# REPLACE "translate.example.com" everywhere below with your real domain
# before using this.
#
# Install:
#   sudo cp nginx/translate.conf /etc/nginx/sites-available/translate
#   sudo ln -s /etc/nginx/sites-available/translate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the cert (certbot writes the paths the ssl_certificate
# directives below already point at):
#   sudo certbot --nginx -d translate.example.com

upstream translate_backend {
    server 127.0.0.1:6010;
    keepalive 16;
}

# Plain HTTP: only serves the ACME challenge for cert issuance/renewal,
# everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name translate.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name translate.example.com;

    ssl_certificate     /etc/letsencrypt/live/translate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/translate.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Text payloads only (no file uploads on this API) — small cap is
    # plenty and blocks accidental/abusive oversized bodies.
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    location / {
        proxy_pass http://translate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # translate-service's own gunicorn worker timeout is 60s; this
        # just needs to clear that with margin, not match it exactly.
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
