# Standalone translation stack — deployed and run independently of
# talkmos-backend, which reaches it over the host machine at
# http://host.docker.internal:6010 (see translate/talkmos-backend's own
# docker-compose.yml and .env for TRANSLATE_SERVICE_URL). Nothing in here
# knows talkmos-backend exists; it's just a plain translation API.

# Shared resource limits, merged into every service below via
# `<<: *resource-limits`. Services that need more than this override the
# individual key (see `langid` and `nllb-translate`); a plain `<<:` merge
# loses to any key the service sets itself.
#
# There is no cap_drop/read_only/security_opt here. That used to be blocked
# by libretranslate needing to run as root to write its model volume, and
# that service is gone now — every remaining container builds from this repo,
# owns no volume, and could take a blanket cap_drop: ALL. Worth doing as its
# own change rather than smuggled into this one.
x-resource-limits: &resource-limits
  cpus: "2.0"
  mem_limit: 2g
  memswap_limit: 2g

services:
  # Orchestrator and the only service published to the host — everything
  # else is internal-only, reachable from here alone. Owns the whole
  # pipeline: language detection, deciding when to transliterate, then
  # calling NLLB for the actual translation.
  translate:
    build:
      context: ./translate-service
    container_name: translator-translate
    restart: unless-stopped
    ports:
      - "6010:8200"
    depends_on:
      - langid
      - nllb-translate
      - transliterate
    <<: *resource-limits

  # Language identification (GlotLID), replacing what LibreTranslate was
  # still here for. Its detector called romanized Hindi confident English,
  # which skipped transliteration and made the pipeline echo the caller's
  # own text back — see langid/app.py for the full account. No ports
  # published — only `translate` talks to it, at http://langid:8400.
  langid:
    build:
      context: ./langid
    container_name: translator-langid
    restart: unless-stopped
    # Overrides the shared budget: the GlotLID checkpoint is ~1.7GB and
    # fastText holds all of it resident. Still a net saving here, since the
    # LibreTranslate container this replaces carried its own Argos models.
    mem_limit: 3g
    memswap_limit: 3g
    <<: *resource-limits

  # NLLB-200 (distilled 600M) via CTranslate2 — the actual translation
  # engine, replacing Argos Translate's own (noticeably less fluent)
  # models. No ports published — only `translate` talks to it, at
  # http://nllb-translate:8300. See nllb-translate/app.py for the full
  # rationale.
  nllb-translate:
    build:
      context: ./nllb-translate
    container_name: translator-nllb-translate
    restart: unless-stopped
    # Overrides the shared 1GB budget below: an int8-quantized 600M-param
    # model plus the CTranslate2/transformers runtime needs more headroom
    # than that to even start, though it stays well inside the shared CPU
    # budget once running.
    mem_limit: 2g
    memswap_limit: 2g
    <<: *resource-limits

  # Romanized-Hindi ("Hinglish") -> Devanagari, ahead of the NLLB model,
  # which expects native Devanagari script; fed "toh kaise hai aap" directly
  # it doesn't reliably read it as Hindi at all. `translate` only routes text
  # here when `langid` reports it as romanized Indic, not on every request.
  # No ports published — internal only, at http://transliterate:8100.
  # Rule-based conversion (see app.py) — no model weights to fetch or cache,
  # so no volume needed here either.
  transliterate:
    build:
      context: ./transliterate
    container_name: translator-transliterate
    restart: unless-stopped
    <<: *resource-limits
